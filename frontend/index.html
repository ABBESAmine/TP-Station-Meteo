<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station météo</title>
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Station météo connectée — température et humidité en temps réel.">
  <link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>STATION MÉTÉO</h1>
        <p class="small">Température / Humidité en temps réel</p>
      </div>
      <div class="status">
        <span class="badge" id="statusText">Hors ligne</span>
        <span class="small" id="lastUpdate">—</span>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Température</h2>
        <div class="value">
          <span class="number" id="tempValue">—</span>
          <span class="unit" id="tempUnit">°C</span>
        </div>
        <div class="small" id="tempMeta">—</div>
      </section>

      <section class="card">
        <h2>Humidité</h2>
        <div class="value">
          <span class="number" id="humValue">—</span>
          <span class="unit">%</span>
        </div>
        <div class="small" id="humMeta">—</div>
      </section>

      <section class="card">
        <h2>Connexion</h2>
        <div id="liveControls" class="block">
          <label class="label" for="wsUrl">URL WebSocket</label>
          <input class="input" id="wsUrl" type="url" spellcheck="false" inputmode="url" placeholder="ws://localhost:8080" />
          <div class="row">
            <button class="btn" id="connectBtn" type="button">Connexion</button>
            <span class="small">Unité: <strong id="unitPill">—</strong></span>
          </div>
        </div>

        <details class="details">
          <summary>Dernier message reçu</summary>
          <pre class="payload" id="payload">—</pre>
        </details>
      </section>
    </main>

    <footer class="footer small">
      Les rois d'Afrique pour vous servir : Amine - Issa - Mikael - Drame - Daniel 
    </footer>
  </div>

  <script type="module" src="./app.js?v=2"></script>
</body>
</html>
